name: Build Goemaxima Image
on:
  workflow_dispatch:
    inputs:
      stack-version:
        description: "Stack version to build the goemaxima server image for (blank to use latest available in versions file)"
        default: ""
        type: string

      goemaxima-ref:
        description: "Ref of mathinstitut/goemaxima to build (branch, tag, SHA or blank to use latest available tag)"
        type: string
        default: "master"

      qtype-stack-commit:
        description: "Ref (branch, tag or full SHA) of the qtype_stack plugin to build the stackmaxima libraries from. If set, the libraries are taken from the plugin instead of goemaxima's stack/ folder and stack-version is ignored. Use this when the installed plugin expects a stackmaxima version goemaxima does not ship yet."
        type: string
        default: ""

      qtype-stack-remote:
        description: "Git remote of the qtype_stack plugin (only used together with qtype-stack-commit)"
        type: string
        default: "https://github.com/maths/moodle-qtype_stack"

concurrency:
  group: dbp-moodle-goemaxima-image
  cancel-in-progress: true

jobs:
  get_build_args:
    runs-on: ubuntu-latest
    outputs:
      MAXIMA_VERSION:       ${{ steps.vars.outputs.MAXIMA_VERSION }}
      SBCL_VERSION:         ${{ steps.vars.outputs.SBCL_VERSION }}
      LIB_PATH:             ${{ steps.vars.outputs.LIB_PATH }}
      STACK_VERSION:        ${{ steps.vars.outputs.STACK_VERSION }}
      QTYPE_STACK_REMOTE:   ${{ steps.vars.outputs.QTYPE_STACK_REMOTE }}
      QTYPE_STACK_COMMIT:   ${{ steps.vars.outputs.QTYPE_STACK_COMMIT }}
      LATEST_STACK_VERSION: ${{ steps.latest.outputs.LATEST_STACK_VERSION }}
      IMAGE_TAG_REF:        ${{ steps.tag.outputs.ref_tag }}
    steps:
      - name: Checkout goemaxima
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: mathinstitut/goemaxima
          ref: ${{ inputs['goemaxima-ref'] || 'master' }}
          path: goemaxima

      - name: Extract latest stack version
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          cd goemaxima
          # Grab the last non-comment, non-empty line and print the first field from the versions file
          LATEST="$(awk '!/^#/ && NF { last=$1 } END { print last }' versions)"
          if [ -z "${LATEST:-}" ]; then
            echo "Could not determine latest stack version from 'versions' file" >&2
            exit 1
          fi
          echo "LATEST_STACK_VERSION=$LATEST" >> "$GITHUB_OUTPUT"

      # When building against a specific qtype_stack ref, the stackmaxima
      # version is defined by the plugin itself, so derive it from there
      # (same extraction the goemaxima Dockerfile uses).
      - name: Derive stackmaxima version from qtype_stack plugin
        id: plugin
        if: ${{ inputs['qtype-stack-commit'] != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git init -q qtype_stack
          cd qtype_stack
          git remote add origin "${{ inputs['qtype-stack-remote'] }}"
          git fetch -q --depth 1 origin "${{ inputs['qtype-stack-commit'] }}"
          git checkout -q FETCH_HEAD
          STACKVER="$(tail -n1 stack/maxima/stackmaxima.mac | cut -d ':' -f2 | tr -d '$' | tr -d '[:space:]')"
          if ! [[ "$STACKVER" =~ ^[0-9]{10}$ ]]; then
            echo "Could not derive stackmaxima version from plugin (got: '$STACKVER')" >&2
            exit 1
          fi
          echo "Plugin stackmaxima version: $STACKVER"
          echo "PLUGIN_STACK_VERSION=$STACKVER" >> "$GITHUB_OUTPUT"

      - name: Extract versions for ${{ steps.plugin.outputs.PLUGIN_STACK_VERSION || inputs['stack-version'] || steps.latest.outputs.LATEST_STACK_VERSION }}
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          cd goemaxima

          if [ -n "${{ inputs['qtype-stack-commit'] }}" ]; then
            # Plugin mode: libraries are cloned from qtype_stack inside the
            # Dockerfile, so LIB_PATH must stay empty.
            STACK="${{ steps.plugin.outputs.PLUGIN_STACK_VERSION }}"
            LIB_PATH=""
            QTYPE_STACK_REMOTE="${{ inputs['qtype-stack-remote'] }}"
            QTYPE_STACK_COMMIT="${{ inputs['qtype-stack-commit'] }}"
          else
            STACK="${{ inputs['stack-version'] || steps.latest.outputs.LATEST_STACK_VERSION }}"
            LIB_PATH="stack/${STACK}/maxima"
            QTYPE_STACK_REMOTE=""
            QTYPE_STACK_COMMIT=""
          fi

          # Find the line for this stack version in the 'versions' file
          LINE="$(awk -v s="$STACK" '$1==s{print $0}' versions || true)"
          if [ -z "$LINE" ]; then
            if [ -n "$QTYPE_STACK_COMMIT" ]; then
              # Plugin is newer than goemaxima's versions file: fall back to
              # the Maxima/SBCL versions of the newest known entry.
              LINE="$(awk '!/^#/ && NF' versions | tail -n1)"
              echo "::warning::stackmaxima version '$STACK' not found in goemaxima versions file, falling back to Maxima/SBCL versions of entry '$(echo "$LINE" | cut -f1)'"
            else
              echo "Requested stack version '$STACK' not found in versions file" >&2
              exit 1
            fi
          fi

          MAXIMA_VERSION="$(echo "$LINE" | cut -f2)"
          SBCL_VERSION="$(echo "$LINE"   | cut -f3)"

          # Job outputs for downstream jobs
          echo "MAXIMA_VERSION=$MAXIMA_VERSION"           >> "$GITHUB_OUTPUT"
          echo "SBCL_VERSION=$SBCL_VERSION"               >> "$GITHUB_OUTPUT"
          echo "LIB_PATH=$LIB_PATH"                       >> "$GITHUB_OUTPUT"
          echo "STACK_VERSION=$STACK"                     >> "$GITHUB_OUTPUT"
          echo "QTYPE_STACK_REMOTE=$QTYPE_STACK_REMOTE"   >> "$GITHUB_OUTPUT"
          echo "QTYPE_STACK_COMMIT=$QTYPE_STACK_COMMIT"   >> "$GITHUB_OUTPUT"

          echo "::group::Build argument summary"
          echo "STACK:              $STACK"
          echo "MAXIMA_VERSION:     $MAXIMA_VERSION"
          echo "SBCL_VERSION:       $SBCL_VERSION"
          echo "LIB_PATH:           $LIB_PATH"
          echo "QTYPE_STACK_REMOTE: $QTYPE_STACK_REMOTE"
          echo "QTYPE_STACK_COMMIT: $QTYPE_STACK_COMMIT"
          echo "::endgroup::"

      # The versioning of the repository is not actively used (last version bump to 1.2.0 was in 2024, changes to the dockerfile were made past this point)
      # Therefore we have to build from the main branch and add a timestammp if we do so.
      - name: Set image tag
        id: tag
        shell: bash
        run: |
          REF="${{ inputs['goemaxima-ref'] || 'master' }}"
          if [ "$REF" = "master" ]; then
            TIMESTAMP=$(date +%Y%m%d)
            TAG="master-${TIMESTAMP}"
          else
            TAG="$REF"
          fi
          echo "ref_tag=$TAG" >> "$GITHUB_OUTPUT"

      # The reusable workflow only supports local build contexts (it prefixes
      # the context with ./checkout/), so a remote git URL context cannot be
      # used. Instead, hand over the goemaxima checkout as the 'build-code.tar'
      # artifact and call the reusable workflow with code_source: artifact.
      - name: Pack goemaxima source for build job
        shell: bash
        run: |
          tar -cf build-code.tar --exclude .git -C goemaxima .

      - name: Upload build code artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: build-code.tar
          path: build-code.tar
          retention-days: 1

  build_image_and_push:
    permissions:
      packages: write
      security-events: write
      contents: read
    needs: get_build_args
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@8
    with:
      image_name: "goemaxima"
      run_trivy_scan: true
      image_tag_generation: specified
      image_tag: "${{ needs.get_build_args.outputs.STACK_VERSION }}-${{ needs.get_build_args.outputs.IMAGE_TAG_REF }}"
      add_latest_tag: true
      container_registry: "ghcr.io"
      fail_on_vulnerabilites: false
      code_source: artifact
      context: "./"
      build_args: |
        MAXIMA_VERSION=${{ needs.get_build_args.outputs.MAXIMA_VERSION }}
        SBCL_VERSION=${{ needs.get_build_args.outputs.SBCL_VERSION }}
        LIB_PATH=${{ needs.get_build_args.outputs.LIB_PATH }}
        QTYPE_STACK_REMOTE=${{ needs.get_build_args.outputs.QTYPE_STACK_REMOTE }}
        QTYPE_STACK_COMMIT=${{ needs.get_build_args.outputs.QTYPE_STACK_COMMIT }}
