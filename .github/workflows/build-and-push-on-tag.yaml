---
name: Build and push Docker Image on Tag

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
jobs:
  pre_build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      suffix: ${{ steps.tag.outputs.suffix }}
    steps:
      - name: Filter Tag name
        uses: olegtarasov/get-tag@53af8e1e538a0ffab949cdde3e332d8e58e8630f # v2.1
        id: tag
        with:
          tagRegex: "(?<tag>[0-9]+.[0-9]+.[0-9]+)(?<suffix>-.*)"
  
  build_and_push:
    permissions:
      packages: write
      security-events: write
      actions: read
      contents: read
    needs: pre_build
    uses: dbildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@ac540af7a37263a102c7bc6c8c9447a7b176f027 # 8.6.0
    with:
      container_registry: "ghcr.io"
      image_name: "moodle"
      image_tag_generation: "specified,mm_git_tag"
      image_tag: "${{ needs.pre_build.outputs.tag }}${{ needs.pre_build.outputs.suffix }}"
      context: "./moodle/"
