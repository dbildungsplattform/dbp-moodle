{{- range $object := .Values.extraObjects }}
---
{{- $meta := get $object "metadata" | default dict }}
{{- $namespace := get $meta "namespace" | default $.Release.Namespace }}
{{- $labels := merge (dict
  "app.kubernetes.io/managed-by" $.Release.Service
  "helm.sh/chart" (printf "%s-%s" $.Chart.Name $.Chart.Version)
  "app.kubernetes.io/instance" $.Release.Name
  "app.kubernetes.io/name" $.Chart.Name
) (get $meta "labels" | default dict) }}
{{- $metadata := merge $meta (dict "namespace" $namespace "labels" $labels) }}
{{ toYaml (merge $object (dict "metadata" $metadata)) }}
{{- end }}
