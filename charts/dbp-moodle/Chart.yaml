apiVersion: v2
name: dbp-moodle
description: |
  This is a Helm Chart bundling some of the bitnami resources to deploy Moodle for DBildungsplattform. Extending them with features such as 
  PostgreSQL support, Horizontal Autoscaling capabilities, Redis Session Store, Etherpad-Lite.
  The Chart can be deployed without any modification but it is advised to set own secrets acccording to this readme.
type: application
home: https://dbildungsplattform.github.io/dbp-moodle/
version: 1.8.2
appVersion: "4.5.14"
dependencies:
  - name: moodle
    version: "27.0.5"
    repository: "file://charts/moodle"

  # Replaced by valkey
  - name: redis
    version: "19.5.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

  - name: valkey
    version: "3.0.1"
    repository: https://dbildungsplattform.github.io/helm-charts-registry/
    condition: valkey.enabled

  - name: cronjob
    alias: moodlecronjob
    version: 0.1.0
    repository: "file://charts/cronjob"

  - name: cronjob
    alias: backup-cronjob
    version: 0.1.0
    repository: "file://charts/cronjob"
    condition: dbpMoodle.backup.enabled

  - name: etherpad
    version: 0.1.0
    repository: "file://charts/etherpad"
    alias: etherpadlite
    condition: etherpadlite.enabled

  - name: clamav
    version: 3.7.3
    repository: "https://wiremind.github.io/wiremind-helm-charts"
    alias: clamav
    condition: clamav.enabled

  - name: sql-exporter
    version: 0.18.10
    repository: "https://burningalchemist.github.io/sql_exporter/"
    condition: sql-exporter.enabled
