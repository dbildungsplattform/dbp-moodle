{{- if and .Values.ingress.enabled .Values.ingress.middlewares }}
{{- range $mw := .Values.ingress.middlewares }}
---
apiVersion: {{ $mw.apiVersion | default $.Values.ingress.middlewareApiVersion }}
kind: {{ $mw.kind | default $.Values.ingress.middlewareKind }}
metadata:
  name: {{ $mw.name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.commonLabels "context" $ ) | nindent 4 }}
spec:
  {{- toYaml $mw.spec | nindent 2 }}
{{- end }}
{{- end }}
