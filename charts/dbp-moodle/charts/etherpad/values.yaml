replicaCount: 1

image:
  repository: ghcr.io/dbildungsplattform/etherpad
  pullPolicy: IfNotPresent
  tag: "3.3.3.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 9001

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- List of middlewares to create as Kubernetes Middleware resources and reference on the
  # -- ingress. Each entry needs a `name` and a `spec`. The `name` is used verbatim as the
  # -- resource name, so it must be unique per namespace. The order of the list determines the
  # -- order in which the middlewares are referenced on the ingress.
  # middlewares:
  #   - name: rate-limit
  #     spec:
  #       plugin:
  #         name: rate
  #         config:
  #           rate: "1000"
  middlewares: []
  # -- API version used for the generated Middleware resources. Can be overridden per middleware
  # -- entry by setting `apiVersion` on the entry.
  middlewareApiVersion: traefik.io/v1alpha1
  # -- Kind used for the generated Middleware resources. Can be overridden per middleware entry by
  # -- setting `kind` on the entry.
  middlewareKind: Middleware
  # -- Annotation key used to reference the middlewares on the ingress. If the annotation is set
  # -- explicitly under ingress.annotations it takes precedence over the generated one.
  middlewareAnnotationKey: traefik.ingress.kubernetes.io/router.middlewares
  hosts:
    - host: chart-example.local
      paths: []
        # - path: /
        #   pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  # @param ingress.ingressClassName IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  # This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
  # ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
  ingressClassName: ""

externalDatabase:
  # -- Type of DB to provision, possible values are "postgres"
  type: "postgres"
  # -- Host of the existing database
  host: ""
  # -- Port of the existing database
  port: 5432
  # -- Existing username in the external db
  user: ""
  # -- Password for the above username
  password: ""
  # -- Name of the existing database
  database: ""
  # -- Name of an existing secret resource containing the DB password
  existingSecret: ""
  # -- Name of the key holding the DB password in the existing Secret
  existingSecretKey: ""
  # -- Use ssl to communicate with the database
  ssl: false

env: []
  # - name: DB_TYPE
  #   value:
  # - name: DB_HOST
  #   value:
  # - name: DB_PORT
  #   value:
  # - name: DB_NAME
  #   value:
  # - name: DB_USER
  #   value:
  # - name: DB_PASS
  #   valueFrom:
  #     secretKeyRef:
  #       name:
  #       key:

envFrom: []

volumes: []

volumeMounts: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
