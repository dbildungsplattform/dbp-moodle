{{- if .Values.ingress.enabled -}}
{{- $fullName := include "etherpad.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "etherpad.labels" . | nindent 4 }}
  {{- $middlewareAnnotations := include "etherpad.ingress.middlewareAnnotations" . | fromYaml }}
  {{- $annotations := (.Values.ingress.annotations | default dict) | deepCopy }}
  {{- /* The generated middleware annotation is only added if the user did not set that key, so user annotations take precedence. */}}
  {{- range $key, $value := $middlewareAnnotations }}
  {{- if not (hasKey $annotations $key) }}
  {{- $_ := set $annotations $key $value }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
  {{- end }}
