dbpMoodle:
  name: infra
  stage: infra

  # -- disallows all egress from release namespace for the moodle deployment
  allowInternalNetworkingOnly: false

  # -- use a configmap to determine which system plugins should be uninstalled --
  uninstallSystemPlugins: false

  phpConfig:
    # -- Extended php logging
    extendedLogging: false
    # -- Moodle debugging is not safe for production
    debug: false
    # -- Prevents the installation of Plugins from the Moodle Web Interface for Admins (Disabled by default)
    pluginUIInstallation:
      enabled: false
    ip:
      allowed: ""
      blocked: ""
    # -- Any additional text to be included into the config.php
    additional: ""
    # -- Provide an existing secret containing the config.php instead of generating it from chart
    # -- Remember to adjust moodle.extraVolumes & moodle.extraVolumeMounts when setting this.
    # -- Secret key is by default expected to be config.php
    existingConfig: ""
    # -- A string filled with additional php.ini configuration that overwrites the default one
    additionalPhpIni: |
      memory_limit = 513M
      upload_max_filesize = 201M
      post_max_size = 150M

  # -- Configurations for the optional redis
  redis:
    host: "moodle-redis-master"
    port: 6379

  external_pvc:
    enabled: true
    name: "moodle-data"
    size: "8Gi"
    storage_class: "nfs-client"
    accessModes: ["ReadWriteMany"]
    annotations:
      "helm.sh/resource-policy": "keep"

  # -- Creates a secret with all relevant credentials for moodle
  # -- Set useChartSecret: false to provide your own secret
  # -- If you create your own secret, also set moodle.existingSecret (and moodle.externalDatabase.existingSecret if you bring your own DB)
  secrets:
    useChartSecret: true
    moodle_password: ""
    moodle_user: ""
    database_admin_password: ""
    database_password: ""
    database_user: ""
    database_name: ""
    database_root_password: ""
    etherpad_postgresql_password: ""
    etherpad_api_key: ""
    redis_password: ""

  # -- A preperation job which disables the php-cronjob, scales down the deployment and creates a backup if dbpMoodle.backup.enabled=true
  moodleUpdatePreparationJob:
    enabled: false
    affinity: {}
    tolerations: []
    resources: {}
    # -- Which kubectl image to use
    repository: "ghcr.io/dbildungsplattform"
    image: "moodle-tools"
    tag: "1.1.15"

  moodleUpdatePreparationHook:
    rules:
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "patch"]
      - apiGroups: ["batch"]
        resources: ["cronjobs", "jobs"]
        verbs: ["get", "list", "create", "patch", "watch"]

  # -- Backup configuration. Set enabled=true to enable the backup-cronjob. Also set s3 location credentials
  backup:
    enabled: false
    dump_kind: "full" # Possible values: full, custom
    run_pre_upgrade: true
    # -- Defines the maximum age of a backup before it is deleted
    retention_time: "6M"
    # -- Defines the maximum age of a full backup before a new full backup is created. The backups in between are incremental
    max_full_backup_age: "1W"
    # -- Provide a List of keys like: gpg_key_names: ["devops", "fallback"]
    gpg_key_names: []
    # -- If the gpgkeys values that are provided (gpgkey.devops.pub.asc) are filled with keys, and no existingSecret is provided
    # -- a secret will be created and the "gpg_key_names" value should be set to "devops" to match the created keys identifier
    gpgkeys:
      gpgkey.devops.pub.asc: ""
      gpgkey.devops.sec.asc: ""
      # -- Existing  secret for gpg keys, make sure the keys identifier is set in "gpg_key_names" for the backup to work properly
      # -- Example: gpgkey.devops.pub.asc  -> gpg_key_names: ["devops"]
      # -- If no value is set, a secret will be created with the keys from the values above
      existingSecret: ""
    s3_bucket_name: ""
    cluster_name: ""
    endpoint: ""
    # -- Either provide an existing secret, or set each secret value here. If both are set the existingSecret is used
    secrets:
      s3_access_key: ""
      s3_access_secret: ""
      s3_endpoint_url: ""
      # -- Existing secret for s3 endpoint
      existingSecret: ""
    # -- Secret key of a certificate for duply to connect to s3 endpoint using SSL, useful to trust self-signed certificates
    # -- certificate has to mounted "manually" under values backup-cronjob
    s3_certificate_secret:
      enabled: false
      name: "s3-certificate"
      # -- Path where the certificate is mounted
      key: "certificate.crt"
      mountpath: "/certs"
    rules:
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "patch", "list", watch]
      - apiGroups: ["batch"]
        resources: ["cronjobs", "jobs"]
        verbs: ["get", "patch"]

  # -- This restores moodle to the latest snapshot. Requires an existing s3 backup. ONLY USE FOR ROLLBACK
  restore:
    enabled: false
    restoreDate: ""
    # replace_db_user_during_restore is only added for the migration from local to managed postgres as the restore script needs to be adjusted dynamically
    replace_db_user_during_restore: false
    dump_kind: "full" # Possible values: full, custom
    repository: "ghcr.io/dbildungsplattform"
    image: "moodle-tools"
    tag: "1.1.15"
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
    podSecurityContext:
      fsGroup: 1001
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      runAsGroup: 1001
      capabilities:
        drop:
          - ALL
    existingSecretGPG: ""
    existingSecretDatabaseConfig: "moodle-database"
    existingSecretDatabasePassword: "moodle"
    existingSecretKeyDatabasePassword: ""
    existingSecretS3: ""
    existingSecretKeyS3Access: ""
    existingSecretKeyS3Secret: ""
    affinity: {}
    tolerations: []

    rules:
      - apiGroups: ["apps"]
        resources: ["deployments/scale", "deployments"]
        verbs: ["get", "list", "patch"]

  # -- Configuration for the moodle-cronjob which runs moodles cron.php. This is required since moodle does not run as root
  moodlecronjob:
    wait_timeout: "15m"
    rules:
      - apiGroups: [""]
        resources: ["pods", "pods/exec"]
        verbs: ["get", "list", "create", "watch"]

  # -- Horizontal pod autoscaling values
  hpa:
    enabled: false
    deployment_name_ref: "moodle"
    min_replicas: 1
    max_replicas: 4
    average_cpu_utilization: 50
    # -- The max amount in percent to scale down in one step per cooldown period
    scaledown_value: 25
    # -- How many seconds to wait between downscaling adjustments
    scaledown_cooldown: 60
    # -- The max amount in percent to scale up in one step per cooldown period
    scaleup_value: 50
    # -- How many seconds to wait between upscaling adjustments
    scaleup_cooldown: 15

  goemaxima:
    enabled: false
    image:
      repository: ghcr.io/dbildungsplattform/goemaxima
      tag: "2026080600-master-20260811"
      pullPolicy: IfNotPresent
      # digest: "sha256:897..."


    replicaCount: 1

    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080
      annotations: {}
      labels: {}

    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"

    env:
      MAXIMA_TIMEOUT: "30"

    podSecurityContext: {}
      # fsGroup: 1000
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault

moodle:
  updateStrategy:
    type: RollingUpdate
  image:
    registry: "ghcr.io"
    repository: "dbildungsplattform/moodle"
    # -- The dbp-moodle image which is build for this helm chart
    tag: "4.5.12-fpm-trixie-8.2.31-dbp5"
    pullPolicy: Always
    # -- Debug mode for more detailed moodle installation and log output
    debug: false
  moodleSkipInstall: false
  moodleSiteName: "Moodle"
  moodleLang: "de"
  moodleUsername: admin
  moodleEmail: ""
  allowEmptyPassword: false
  extraEnvVars:
    - name: PHP_POST_MAX_SIZE
      value: "200M"
    - name: PHP_UPLOAD_MAX_FILESIZE
      value: "200M"
    - name: PHP_MAX_INPUT_VARS
      value: "5000"
    - name: MOODLE_PLUGINS
      valueFrom:
        configMapKeyRef:
          name: moodle-plugins
          key: moodle-plugin-list
    - name: MOODLE_PLUGINS_SYS_UNINSTALL
      valueFrom:
        configMapKeyRef:
          name: moodle-plugins
          key: moodle-plugin-sys-uninstall-list
  extraEnvVarsSecret: ""
  # --	If this value is unset, the bitnami/moodle chart generates its own secret
  existingSecret: "moodle"
  persistence:
    # -- If this value is unset, the bitnami/moodle chart generates its own PV & PVC
    existingClaim: "moodle-data"
  affinity: {}
  tolerations: []
  readinessProbe:
    path: /login/index.php?noredirect=1
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 6
      memory: 3Gi
  externalDatabase:
    # -- Type of DB to provision, possible values are "pgsql"
    type: "pgsql"
    # -- Host of the existing database
    host: ""
    # -- Port of the existing database
    port: 5432
    # -- Existing username in the external db
    user: "moodle"
    # -- Password for the above username
    password: ""
    # -- Name of the existing database
    database: "moodle"
    # -- Name of an existing secret resource containing the DB password with the key 'db-password'
    existingSecret: "moodle"
  service:
    type: ClusterIP
  ingress:
    enabled: true
    # -- The hostname of the moodle application
    hostname: "example.de"
    # -- Any additional hostnames, needs to be "name: URL" value pairs
    extraHosts: []
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: sc-cert-manager-clusterissuer-letsencrypt
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30s"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "20s"
      nginx.ingress.kubernetes.io/proxy-body-size: "200M"
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0"
  metrics:
    enabled: true
    image:
      repository: lusotycoon/apache-exporter
      tag: v1.0.12
    service:
      type: ClusterIP
    # -- Resources have to be set so that the horizontal pod autoscaler for moodle can read the moodle cpu consumption correctly
    resources: 
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 256Mi
  extraVolumeMounts:
    - name: moodle-additional-php-ini-file
      readOnly: true
      mountPath: /moodleconfig/
    - name: moodle-php-config
      readOnly: true
      mountPath: /moodleconfig/config-php
  extraVolumes:
    # -- The additional php.ini which gets filled with custom values
    - name: moodle-additional-php-ini-file
      configMap:
        name: moodle-additional-php-ini-file
        items:
          - key: moodle-php.ini
            path: 01-dbp-php.ini
        defaultMode: 0644
    # -- The custom config.php file that is used to configure moodle to use the database and redis (if activated)
    - name: moodle-php-config
      secret:
        secretName: moodle-php-config
        items:
          - key: config.php
            path: config.php
        defaultMode: 0644
  podAnnotations:
    moodle/image: '{{- .Values.image.repository -}}:{{- .Values.image.tag -}}'
    moodleplugins/checksum: '{{- include "dbpMoodle.pluginConfigMap.content" . | sha256sum -}}'
  containerSecurityContext:
    enabled: true
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
  podSecurityContext:
    enabled: true
  containerPorts:
    http: 8080
    https: 8443
  networkPolicy:
    enabled: false
  startupProbe:
    enabled: true
    failureThreshold: 120

postgresql:
  enabled: true
  # Switch to bitnamilegacy, see https://github.com/bitnami/charts/issues/35164
  image:
    repository: bitnamilegacy/postgresql
    tag: "14.18.0-debian-12-r0"
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/postgres-exporter
    serviceMonitor:
      enabled: true
  auth:
    username: "moodle"
    database: "moodle"
    existingSecret: "moodle"
    secretKeys:
      adminPasswordKey: "db-admin-password"
      # -- Moodle expects its db password key to be db-password
      userPasswordKey: "db-password"
  primary:
    extendedConfiguration: |
      max_connections = 800
    containerSecurityContext:
      privileged: false
    affinity: {}
    tolerations: []
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: 9
        memory: "3Gi"

valkey:
  enabled: false
  fullnameOverride: moodle-redis-master
  auth:
    existingSecret:
      name: "moodle"
      key: "redis-password"
  useDeploymentWhenNonHA: true
  storage:
    requestedSize: 8Gi
    keepPvc: false
  valkeyConfig: |
    maxmemory 3gb
    maxmemory-policy noeviction
  metrics:
    enabled: false

# redis helm chart values
redis:
  enabled: false
  # Switch to bitnamilegacy, see https://github.com/bitnami/charts/issues/35164
  image:
      repository: bitnamilegacy/redis
  sentinel:
    image:
      repository: bitnamilegacy/redis-sentinel
  metrics:
    image:
      repository: bitnamilegacy/redis-exporter
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  sysctl:
    image:
      repository: bitnamilegacy/os-shell
  kubectl:
    image:
      repository: bitnamilegacy/kubectl
  architecture: "standalone"
  auth:
    enabled: true
    existingSecret: "moodle"
    existingSecretPasswordKey: "redis-password"
    usePasswordFileFromSecret: true
  master:
    affinity: {}
    tolerations: []
    resources: {}

etherpadlite:
  enabled: false
  image:
    repository: "ghcr.io/dbildungsplattform/etherpad"
    tag: "2.6.1.0"
  # Currently this data is doubled with the env vars because we need the fields for backup and retore jobs
  externalDatabase:
    # -- Type of DB to provision, possible values are "postgres"
    type: "postgres"
    # -- Host of the existing database
    host: "moodle-etherpad-postgresql"
    # -- Port of the existing database
    port: 5432
    # -- Existing username in the external db
    user: "etherpad"
    # -- Password for the above username
    password: ""
    # -- Name of the existing database
    database: "etherpad"
    # -- Name of an existing secret resource containing the DB password
    existingSecret: "moodle"
    # -- Name of the key holding the DB password in the existing Secret
    existingSecretKey: "etherpad-postgresql-password"
    # -- -- Use ssl to communicate with the database
    ssl: false
  env:
    - name: DB_TYPE
      value: "postgres"
    - name: DB_HOST
      value: "moodle-etherpad-postgresql"
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "etherpad"
    - name: DB_USER
      value: "etherpad"
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: "moodle"
          key: "etherpad-postgresql-password"
    - name: REQUIRE_SESSION
      value: "true"
  volumes:
    - name: "api-key"
      secret:
        secretName: "moodle"
        items:
          - key: "etherpad-api-key"
            path: "APIKEY.txt"
    - name: "etherpad-settings"
      configMap:
        name: "etherpad-settings"
  volumeMounts:
    - name: "api-key"
      mountPath: "/opt/etherpad-lite/APIKEY.txt"
      subPath: "APIKEY.txt"
    - name: "etherpad-settings"
      mountPath: "/opt/etherpad-lite/settings.json"
      subPath: settings
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "sc-cert-manager-clusterissuer-letsencrypt"
    hosts:
      - host: "etherpad.example.de"
        paths:
          - path: "/"
            pathType: "Prefix"
    tls:
      - secretName: "etherpad.example.de-tls"
        hosts:
          - "etherpad.example.de"
  securityContext:
    privileged: false
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

etherpad-postgresql:
  enabled: false
  # Switch to bitnamilegacy, see https://github.com/bitnami/charts/issues/35164
  image:
    repository: bitnamilegacy/postgresql
    tag: "14.18.0-debian-12-r0"
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  metrics:
    image:
      repository: bitnamilegacy/postgres-exporter
  auth:
    enablePostgresUser: false
    username: etherpad
    database: "etherpad"
    existingSecret: "moodle"
    secretKeys:
      userPasswordKey: "etherpad-postgresql-password"
  persistence:
    existingClaim: "moodle-etherpad-postgresql"
  primary:
    containerSecurityContext:
      privileged: false
    affinity: {}
    tolerations: []
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

moodlecronjob:
  image:
    repository: "ghcr.io/dbildungsplattform/moodle-tools"
    tag: "1.1.15"
  clusterRole:
    create: false
  serviceAccount:
    name: "moodle-cronjob"
    create: false
  podSecurityContext:
    fsGroup: 1001
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    runAsGroup: 1001
    runAsUser: 1001
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  affinity: {}
  tolerations: []
  resources: {}
  jobs:
    - name: php-script
      schedule: "* * * * *"
      concurrencyPolicy: Forbid
      failedJobsHistoryLimit: 1
      successfulJobsHistoryLimit: 1
      backoffLimit: 1
      restartPolicy: Never
      command:
        - /bin/bash
        - -c
      args:
        - /scripts/cronjob-script
      extraVolumeMounts:
        - name: moodle-php-script
          mountPath: /scripts/
      extraVolumes:
        - name: moodle-php-script
          configMap:
            name: moodle-php-script
            defaultMode: 0554
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 2
        periodSeconds: 2

backup-cronjob:
  image:
    repository: "ghcr.io/dbildungsplattform/moodle-tools"
    tag: "1.1.15"
  clusterRole:
    create: false
  serviceAccount:
    name: "moodle-backup-job"
    create: false
  env:
    - name: DATABASE_HOST
      valueFrom: 
        secretKeyRef:
          name: moodle-database
          key: host
    - name: DATABASE_PORT
      valueFrom: 
        secretKeyRef:
          name: moodle-database
          key: port
    - name: DATABASE_NAME
      valueFrom:
        secretKeyRef:
          name: moodle-database
          key: name
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: moodle-database
          key: user
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: moodle
          key: mariadb-password
    - name: DATABASE_HOST_ETHERPAD
      valueFrom: 
        secretKeyRef:
          name: etherpad-database
          key: host
    - name: DATABASE_PORT_ETHERPAD
      valueFrom: 
        secretKeyRef:
          name: etherpad-database
          key: port
    - name: DATABASE_NAME_ETHERPAD
      valueFrom:
        secretKeyRef:
          name: etherpad-database
          key: name
    - name: DATABASE_USER_ETHERPAD
      valueFrom:
        secretKeyRef:
          name: etherpad-database
          key: user
    - name: DATABASE_PASSWORD_ETHERPAD
      valueFrom:
        secretKeyRef:
          name: moodle
          key: etherpad-postgresql-password
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: moodle-backup-s3
          key: s3_access_key
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: moodle-backup-s3
          key: s3_access_secret
    - name: S3_BACKUP_REGION_URL
      valueFrom:
        secretKeyRef:
          name: moodle-backup-s3
          key: s3_endpoint_url
  extraVolumeMounts:
    - name: moodle-backup-script
      mountPath: /scripts/
    - name: moodle-pvc-data
      mountPath: /mountData
    - name: duply
      mountPath: /etc/duply/default/
  extraVolumes:
    - name: moodle-pvc-data
      persistentVolumeClaim:
        claimName: "moodle-data"
    - name: moodle-backup-script
      configMap:
        name: moodle-backup-script
        defaultMode: 0711
    - name: duply
      projected:
        sources:
          - configMap:
              name: moodle-backup-duply
              items:
                - key: conf
                  path: conf
                - key: exclude
                  path: exclude
          - secret:
              name: moodle-backup-gpg-keys
        defaultMode: 0644
  podSecurityContext:
    fsGroup: 1001
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    runAsGroup: 1001
    capabilities:
      drop:
        - ALL
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  jobs:
    - name: backup
      schedule: "0 3 * * *"
      failedJobsHistoryLimit: 1
      successfulJobsHistoryLimit: 1
      command:
        - /bin/sh
        - -c
      args:
        - /scripts/backup-script
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 5
        periodSeconds: 10

clamav:
  enabled: true
  image:
    tag: "1.5.1"
    pullPolicy: "IfNotPresent"
  kind: StatefulSet
  service:
    type: ClusterIP
    port: 3310
  freshclamConfig: |
    Bytecode yes
    DatabaseDirectory /data
    DatabaseMirror database.clamav.net
    DatabaseOwner 1001
    LogTime yes
    NotifyClamd /etc/clamav/clamd.conf
    PidFile /tmp/freshclam.pid
    ScriptedUpdates yes
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    privileged: false
    capabilities:
      drop:
        - ALL
  tolerations: []
  affinity: {}
  resources: 
    limits:
      cpu: 1000m
      memory: 4Gi
    requests:
      cpu: 200m
      memory: 2Gi
  hpa:
    enabled: false

sql-exporter:
  enabled: false
  image:
    pullPolicy: "IfNotPresent"
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
  affinity: {}
  tolerations: []
  resources: {}
  extraVolumes:
    - name: moodle-collector-config
      volume:
        configMap:
          name: moodle-sql-exporter-configmap
          items:
            - key: moodle-collector-config
              path: sql_exporter_moodle.yaml
      mount:
        readOnly: true
        mountPath: /etc/sql_exporter/collectors/
  config:
    collector_files: ["collectors/sql_exporter_moodle.yaml"]
    target:
      data_source_name: ""
      collectors: [sql_exporter_moodle]
